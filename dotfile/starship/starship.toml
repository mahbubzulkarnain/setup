# Starship prompt (https://starship.rs/config/)
"$schema" = 'https://starship.rs/config-schema.json'

format = '$all$character'

# git modules run git in every directory, so allow more than the default 500ms
command_timeout = 2000

# Directory scans (the directory and git modules) time out at the 30ms default on big or slow folders
scan_timeout = 500

[username]
show_always = true
style_user = "white"
style_root = "bold red"
format = "[$user]($style) "

[directory]
style = "white"
format = "[in](bright-black) [$path]($style) "
truncate_to_repo = false

[git_branch]
symbol = ""

[character]
success_symbol = "[›](bold white)"
error_symbol = "[›](red)"
