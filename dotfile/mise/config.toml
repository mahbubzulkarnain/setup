# Global mise config (copied to ~/.config/mise/config.toml by mise.sh and windows.nu, then `mise install`).
# Versions are pinned to the latest stable release, so all laptops get the same versions,
# except Kilo CLI, which follows "latest" (setup runs `mise upgrade` for it). Claude Code updates itself.
# To upgrade a pinned tool: bump the version here, run `mise install` on each machine, and commit.
# Deprecated packages are not listed: now (use vercel), tslint (use eslint), godoc (x/tools), ndb (dropped).

[tools]
node = "24.21.0"
go = "1.27.2"
python = "3.15.0"
# Dart is only used to install FVM (dart pub global activate fvm); Flutter SDKs come from FVM
dart = "3.13.5"
# JDK for the Android SDK tools (sdkmanager) and Gradle. Temurin 21 LTS.
java = "temurin-21.0.12+101.0.LTS"

# Global CLIs (npm backend)
"npm:@kilocode/cli" = "latest"
"npm:eslint" = "10.12.0"
"npm:standard" = "17.1.2"
"npm:typescript" = "7.0.2"
"npm:mocha" = "12.0.3"
"npm:jest" = "30.5.2"
"npm:nodemon" = "3.1.14"
"npm:pm2" = "7.0.4"
"npm:live-server" = "1.2.2"
"npm:node-gyp" = "13.1.0"

# Global Go tools (go backend)
"go:honnef.co/go/tools/cmd/staticcheck" = "0.8.1"
